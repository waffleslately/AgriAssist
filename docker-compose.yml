services:
  db:
    image: postgis/postgis:16-3.4
    container_name: agri_postgis
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agri_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agri_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: agri_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/agri_db
      SYNC_DATABASE_URL: postgresql://postgres:postgres@db:5432/agri_db
      REDIS_URL: redis://redis:6379/0
      GEE_ENABLED: "false"
    volumes:
      - .:/app

volumes:
  postgis_data:
